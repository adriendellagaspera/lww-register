name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Read package metadata
        id: package
        run: |
          set -euo pipefail
          metadata="$(cargo metadata --no-deps --format-version 1)"
          crate_name="$(printf '%s' "$metadata" | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["name"])')"
          version="$(printf '%s' "$metadata" | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${version}"
          echo "name=${crate_name}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - run: cargo test --all-features
      - run: cargo package

      - name: Check whether this version is already published
        id: crates_io
        env:
          CRATE_NAME: ${{ steps.package.outputs.name }}
          CRATE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header 'User-Agent: lww-register release workflow' \
            "https://crates.io/api/v1/crates/${CRATE_NAME}/${CRATE_VERSION}")"
          case "$status" in
            200)
              echo "published=true" >> "${GITHUB_OUTPUT}"
              ;;
            404)
              echo "published=false" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "Unexpected crates.io status: $status" >&2
              exit 1
              ;;
          esac

      - id: crates_io_auth
        if: steps.crates_io.outputs.published != 'true'
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        if: steps.crates_io.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        run: cargo publish

      - name: Create or normalize GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq .id 2>/dev/null)"; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -f name="${GITHUB_REF_NAME}" \
              -F draft=false \
              -F prerelease=false \
              >/dev/null
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          fi
