name: mutation profile experiment

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  mutants:
    name: mutants (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [default, no-debug]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0

      - name: Record tool version and mutant count
        run: |
          set -euo pipefail
          cargo mutants --version
          cargo mutants --all-features --list | tee mutant-list.txt
          echo "mutant_count=$(wc -l < mutant-list.txt)"

      - name: Run mutations
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          if test "${VARIANT}" = "no-debug"; then
            export CARGO_PROFILE_TEST_DEBUG=0
          fi
          cargo mutants \
            --all-features \
            --jobs 2 \
            --no-shuffle \
            --caught \
            --unviable

      - name: Print machine-readable outcome
        if: always()
        run: |
          if test -f mutants.out/outcomes.json; then
            cat mutants.out/outcomes.json
          fi
