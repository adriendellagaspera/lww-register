name: mutation sharding experiment

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  full:
    name: mutants (full)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Count mutants
        run: |
          set -euo pipefail
          cargo mutants --all-features --list | tee mutant-list.txt
          echo "mutant_count=$(wc -l < mutant-list.txt)"
      - name: Run mutations
        run: |
          set -euo pipefail
          cargo mutants --all-features --jobs 2 --no-shuffle --caught --unviable

  shard:
    name: mutants (shard=${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Count shard mutants
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          cargo mutants --all-features --shard "${SHARD}/2" --list | tee mutant-list.txt
          echo "mutant_count=$(wc -l < mutant-list.txt)"
      - name: Run mutations
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          cargo mutants \
            --all-features \
            --jobs 2 \
            --shard "${SHARD}/2" \
            --no-shuffle \
            --caught \
            --unviable
