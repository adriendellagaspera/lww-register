name: mutation experiment

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  mutants:
    name: mutants (jobs=${{ matrix.local_jobs }}, repeat=${{ matrix.repeat }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        local_jobs: [2, 3]
        repeat: [1, 2]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0

      - name: Record tool version and mutant count
        run: |
          set -euo pipefail
          cargo mutants --version
          cargo mutants --all-features --list | tee mutant-list.txt
          echo "mutant_count=$(wc -l < mutant-list.txt)"

      - name: Run mutations
        env:
          LOCAL_JOBS: ${{ matrix.local_jobs }}
        run: |
          set -euo pipefail
          cargo mutants \
            --all-features \
            --jobs "${LOCAL_JOBS}" \
            --no-shuffle \
            --caught \
            --unviable

      - name: Print machine-readable outcome
        if: always()
        run: |
          if test -f mutants.out/outcomes.json; then
            cat mutants.out/outcomes.json
          fi
