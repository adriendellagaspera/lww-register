[package]
name = "lww-register"
version = "0.6.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A small state-based last-write-wins register with Hybrid Logical Clock primitives."
repository = "https://github.com/adriendellagaspera/lww-register"
documentation = "https://docs.rs/lww-register"
readme = "README.md"
keywords = ["crdt", "lww", "register", "hlc", "distributed"]
categories = ["data-structures", "concurrency"]

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0.192", default-features = false, features = ["derive"], optional = true }

[package.metadata.docs.rs]
all-features = true
